<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Homie — objednávky</title>
<style>
  :root{
    --paper:#F1F1EC; --card:#FFFFFF; --line:#E4E4DC; --ink:#23231F; --mut:#7C7C73;
    --walnut:#7A5A3A; --walnut-soft:#EFE7DD;
    --done:#1F8A5B; --done-bg:#E6F1EA; --wait:#C2871C; --act:#CE4B2C; --ship:#3D7DC9; --idle:#DBDBD3;
    --mono: ui-monospace,"SFMono-Regular","Menlo",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
  .wrap{max-width:2200px;margin:0 auto;padding:18px 24px 90px}
  .mono{font-family:var(--mono)}
  .login{max-width:360px;margin:13vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px}
  .login h1{margin:0 0 4px;font-size:21px}.login .sub{color:var(--mut);font-size:13px;margin:0 0 18px}
  input,select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:7px 10px}
  .login input{width:100%;margin-bottom:10px}
  button{font-family:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}
  button:hover{background:var(--paper)}
  .navbtn{display:inline-flex;align-items:center;text-decoration:none;color:var(--walnut);border:1px solid var(--walnut);background:#fff;border-radius:8px;padding:7px 12px;font-size:14px;font-weight:600}
  .navbtn:hover{background:var(--walnut-soft)}
  .syncbtn{height:40px;padding:0 18px;font-size:15px;font-weight:700;border:none;border-radius:9px;background:var(--done);color:#fff;cursor:pointer}
  .syncbtn:hover{background:#19754d}
  .syncbtn:disabled{opacity:.6;cursor:default}
  button.primary{background:var(--walnut);color:#fff;border-color:var(--walnut);width:100%;padding:10px}
  .err{color:#b00;font-size:13px;min-height:18px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand .logo{font-size:20px;font-weight:700;letter-spacing:-.4px;color:var(--walnut)}
  .brand .role{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.12em}
  .bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
  .tab{border:none;background:none;padding:7px 14px;border-radius:7px;color:var(--mut)}
  .tab.on{background:var(--walnut-soft);color:var(--walnut);font-weight:600}
  .search{flex:1;min-width:200px;max-width:360px}
  .chk{display:inline-flex;align-items:center;gap:7px;color:var(--mut);font-size:13px;cursor:pointer;user-select:none}
  .count{color:var(--mut);font-size:13px;margin-left:auto}
  /* table */
  .tablecard{background:var(--card);border:1px solid var(--line);border-radius:14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{position:sticky;top:0;z-index:3;background:#FBFBF8;text-align:left;font-weight:600;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th.st,td.st{text-align:center;width:84px}
  th.dt,td.dt{width:128px}
  tbody td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:hover{background:#FBFAF7}
  tr.act-row td:first-child{box-shadow:inset 3px 0 0 var(--wait)}
  .code{font-family:var(--mono);font-size:15px;color:var(--walnut);font-weight:700;white-space:nowrap;cursor:pointer}
  .client{font-weight:600;white-space:nowrap}
  .prod{color:var(--mut);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--idle);background:#fff;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;padding:0}
  .chip.on{background:var(--done);border-color:var(--done)}
  .chip:hover{border-color:var(--walnut)}
  .chip.sf{cursor:default;position:relative}
  .chip.sf::after{content:'';position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--ship);border:1.5px solid #fff}
  .chip.sf:hover{border-color:var(--idle)}
  .chip.sf.on:hover{border-color:var(--done)}
  .chip.cash{position:relative}
  .chip.cash::after{content:'';position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--wait);border:1.5px solid #fff}
  .chip.clk{cursor:pointer}
  .chip.tri.full{background:var(--done);border-color:var(--done)}
  .chip.tri.half{background:linear-gradient(135deg,var(--done) 0 50%,var(--act) 50% 100%);border-color:var(--done)}
  .cashwrap{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .cashrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0;font-size:13px}
  .cashrow input[type=number]{width:130px} .cashrow input[type=date]{width:150px}
  /* invoices in detail */
  .invwrap{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .invhd{font-weight:600;font-size:13px;margin-bottom:8px}
  .invsum{font-size:13px;color:var(--ink);margin-bottom:10px}
  .invsum b{font-weight:600}
  .pill{font-size:11px;padding:2px 8px;border-radius:20px;margin-left:6px;border:1px solid}
  .pill.p-full{color:var(--done);border-color:var(--done);background:var(--done-bg)}
  .pill.p-half{color:var(--wait);border-color:var(--wait)}
  .pill.p-none{color:var(--act);border-color:var(--act)}
  table.inv{width:100%;border-collapse:collapse;font-size:12.5px}
  table.inv th{text-align:left;color:var(--mut);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line)}
  table.inv td{padding:6px 8px;border-bottom:1px solid var(--line)}
  table.inv td.r,table.inv th.r{text-align:right}
  table.inv td.mono{font-family:var(--mono);font-size:12px}
  table.inv .ok{color:var(--done)} table.inv .wait{color:var(--wait)} table.inv .bad{color:var(--act);font-weight:600}
  input.dt{width:120px;font-family:var(--mono);font-size:12px;padding:5px 7px}
  .plan{font-family:var(--mono);font-size:12px;color:var(--ink);cursor:pointer;border-bottom:1px dashed var(--idle)}
  .plan:hover{color:var(--walnut)}
  .exp{border:none;background:none;color:var(--mut);cursor:pointer;font-size:16px;padding:4px 8px}
  /* detail row */
  tr.detail>td{background:#FCFCFA;padding:16px 18px;border-bottom:2px solid var(--line)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px}
  .f{display:flex;flex-direction:column;gap:5px}.f label{font-size:12px;color:var(--mut)}
  .f input,.f textarea{width:100%}.f.full{grid-column:1/-1}
  .detail-actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:12px}
  .btn-done{background:var(--done);color:#fff;border-color:var(--done)}
  .btn-reopen{background:#fff;color:var(--walnut);border-color:var(--walnut)}
  .saved{font-size:12px;color:var(--done);opacity:0;transition:opacity .2s}.saved.show{opacity:1}
  /* archive */
  details.month{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
  details.month>summary{list-style:none;cursor:pointer;padding:13px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
  details.month>summary::-webkit-details-marker{display:none}
  details.month>summary .c{color:var(--mut);font-weight:500;font-size:13px}
  details.month .chev{color:var(--mut);transition:transform .15s;display:inline-block;margin-right:8px}
  details.month[open] .chev{transform:rotate(90deg)}
  .empty{color:var(--mut);font-size:13px;padding:18px}
  .muted{color:var(--mut);font-size:12px}
  .hidden{display:none}
  @media(max-width:1100px){.tablecard{overflow-x:auto}table{min-width:1000px}}
</style>
</head>
<body>

<div id="loginView" class="login">
  <h1>Homie · objednávky</h1>
  <div class="sub">Prihlás sa svojím účtom.</div>
  <input id="email" type="email" placeholder="e-mail" autocomplete="username" />
  <input id="pass" type="password" placeholder="heslo" autocomplete="current-password" />
  <button class="primary" id="loginBtn">Prihlásiť sa</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="appView" class="wrap hidden">
  <div class="top">
    <div class="brand"><span class="logo">Homie</span><span class="role">Operatíva · objednávky</span></div>
    <div style="display:flex;gap:8px;align-items:center"><button id="syncBtn" class="syncbtn">↻ Synchronizovať</button><a id="finLink" class="navbtn hidden" href="./dashboard.html">Financie →</a><button id="logoutBtn">Odhlásiť</button></div>
  </div>

  <div class="bar">
    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="active">Aktívne</button>
      <button class="tab" data-tab="archive">Archív</button>
    </div>
    <input class="search" id="search" placeholder="hľadaj klienta, OBJ, produkt…" />
    <label class="chk" id="onlyActionWrap"><input type="checkbox" id="onlyAction"> iba čo treba konať</label>
    <span class="count" id="count"></span>
  </div>

  <div id="view"></div>
  <p class="muted" id="foot"></p>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL='https://dhvcvfmqzqqxcmcwowwh.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRodmN2Zm1xenFxeGNtY3dvd3doIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMjUzOTksImV4cCI6MjA5NzkwMTM5OX0.CqlyaLv0TeVHcpSZZWfA0_mpTHLnkiMBmNn1KQKfYFs';
const SYNC_URL='https://dashboard-sync-production.up.railway.app';;   // napr. https://homie-sync-production.up.railway.app
const sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=(id)=>document.getElementById(id);
const D=(s)=>new Date(String(s).slice(0,10)+'T00:00:00');
const today=(()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());})();
const esc=(s)=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const MON=['Január','Február','Marec','Apríl','Máj','Jún','Júl','August','September','Október','November','December'];
const ymLabel=(ym)=>{ if(!ym) return 'Bez dátumu'; const [y,m]=ym.split('-'); return `${MON[+m-1]} ${y}`; };

// stavové stĺpce v poradí procesu (8). Zdroj: 'sf' = automaticky z faktúr, 'manual' = ručne
const STAGES=[
  ['ops_deposit1_sent','1. záloha','sf'],
  ['ops_deposit1_paid','1. úhrada','sf'],
  ['ops_in_production','Vo výrobe','manual'],
  ['ops_supplier_pay','Úhrada výroby','tri'],
  ['ops_deposit2_sent','2. záloha','sf'],
  ['ops_deposit2_paid','2. úhrada','sf'],
  ['ops_final_sent','Koncová FV','sf'],
  ['ops_delivery_note','Dodací list','manual'],
];

let ORDERS=[],CLIENTS={},DOCS={},TAB='active',Q='',ONLY=false,OPEN=new Set();
const money=(v)=> (v==null||v==='')?'—': new Intl.NumberFormat('sk-SK',{minimumFractionDigits:2,maximumFractionDigits:2}).format(+v)+' €';
const docPaid=(d)=> !!(d && (String(d.status)==='3' || d.paid_at));
const isZaloha = (d)=> /^ZP/i.test(d.code||'') || (d.doc_type||'').startsWith('zaloha');  // zálohová faktúra
const isTaxDoc = (d)=> /^FVZ/i.test(d.code||'');   // daňový doklad k platbe zálohy
const isFinal  = (d)=> /^FV\d/i.test(d.code||'');  // koncová (vyúčtovacia) faktúra FV…
function fvzFor(o,p){ return (DOCS[o.id]||[]).find(d=> isTaxDoc(d) && d.proforma_id && String(d.proforma_id)===String(p.sf_document_id)); }
const profIsPaid=(o,p)=> !!fvzFor(o,p);            // záloha je uhradená IBA ak má vystavený FVZ
function proformas(o){ return (DOCS[o.id]||[]).filter(isZaloha).sort((a,b)=>(a.issued_at||'')<(b.issued_at||'')?-1:1); }
function sfState(o){
  const prof=proformas(o); const p1=prof[0],p2=prof[1];
  const finals=(DOCS[o.id]||[]).filter(isFinal);
  return {
    ops_deposit1_sent: !!p1, ops_deposit1_paid: p1?profIsPaid(o,p1):false,
    ops_deposit2_sent: !!p2, ops_deposit2_paid: p2?profIsPaid(o,p2):false,
    ops_final_sent: finals.length>0,
  };
}
function payState(o){
  const sf=sfState(o);
  const c1=+o.ops_deposit1_cash_amount>0, c2=+o.ops_deposit2_cash_amount>0;
  return {
    ops_deposit1_sent:{on:!!sf.ops_deposit1_sent,src:'sf'},
    ops_deposit1_paid:{on:!!sf.ops_deposit1_paid||c1, src:sf.ops_deposit1_paid?'sf':(c1?'cash':'')},
    ops_deposit2_sent:{on:!!sf.ops_deposit2_sent,src:'sf'},
    ops_deposit2_paid:{on:!!sf.ops_deposit2_paid||c2, src:sf.ops_deposit2_paid?'sf':(c2?'cash':'')},
    ops_final_sent:{on:!!sf.ops_final_sent,src:'sf'},
  };
}

async function init(){const{data}=await sb.auth.getSession();data.session?showApp():showLogin();}
function showLogin(){$('loginView').classList.remove('hidden');$('appView').classList.add('hidden');}
function showApp(){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');checkRole();load();}
async function checkRole(){
  try{
    const u=(await sb.auth.getUser()).data.user; if(!u) return;
    const {data}=await sb.from('profile').select('role').eq('id',u.id).maybeSingle();
    if(data&&data.role==='owner'){ $('finLink').classList.remove('hidden'); }
  }catch(e){}
}
async function doSync(btn){
  if(!SYNC_URL || SYNC_URL.startsWith('SEM_')){ alert('Najprv nastav SYNC_URL (adresu Railway služby) v súbore.'); return; }
  const old=btn.textContent; btn.disabled=true; btn.textContent='Synchronizujem…';
  try{
    const { data:{ session } } = await sb.auth.getSession();
    const r = await fetch(SYNC_URL.replace(/\/$/,'')+'/sync', { method:'POST', headers:{ Authorization:'Bearer '+session.access_token } });
    if(!r.ok) throw new Error('HTTP '+r.status);
    btn.textContent='Hotovo ✓'; await load(); setTimeout(()=>{ btn.textContent=old; btn.disabled=false; },1500);
  }catch(e){ btn.textContent='Chyba — skús znova'; setTimeout(()=>{ btn.textContent=old; btn.disabled=false; },2200); }
}
$('loginBtn').onclick=async()=>{$('loginErr').textContent='';const{error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});error?$('loginErr').textContent='Prihlásenie zlyhalo: '+error.message:showApp();};
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();showLogin();};
$('syncBtn').onclick=()=>doSync($('syncBtn'));

async function load(){
  try{
    const[orders,clients,docs]=await Promise.all([
      sb.from('order').select('*').limit(3000),
      sb.from('client').select('*').limit(6000),
      sb.from('document').select('*').limit(8000),
    ]);
    if(orders.error) throw new Error(orders.error.message);
    CLIENTS={};(clients.data||[]).forEach(c=>{if(c.sf_client_id)CLIENTS[c.sf_client_id]=c.name;});
    DOCS={};(docs.data||[]).forEach(d=>{ if(d.order_id!=null){(DOCS[d.order_id]=DOCS[d.order_id]||[]).push(d);} });
    ORDERS=orders.data||[];
    render();
  }catch(e){$('foot').textContent='Chyba: '+e.message;}
}
const clientName=(o)=>CLIENTS[o.sf_client_id]||o.client_name||'—';
const days=(d)=>d?Math.floor((D(d)-today)/86400000):null;
function needsAction(o){
  if(o.ops_done) return false;
  const dd=days(o.ops_delivery_at);
  if(dd!==null&&dd<=10&&dd>=-120&&!o.ops_deposit2_sent) return true;
  if(dd!==null&&dd<0&&(!o.ops_final_sent||!o.ops_delivery_note)) return true;
  return false;
}
const fmtD=(s)=>s?D(s).toLocaleDateString('sk-SK',{day:'2-digit',month:'2-digit',year:'2-digit'}):'';
const fmtDshort=(s)=>s?D(s).toLocaleDateString('sk-SK',{day:'2-digit',month:'2-digit'}):'';
function planLabel(o){
  const od=o.ops_delivery_at, doo=o.ops_delivery_to;
  if(od&&doo) return `${fmtDshort(od)}–${fmtD(doo)}`;
  if(od) return fmtD(od);
  return '—';
}

function render(){
  $('onlyActionWrap').style.display = TAB==='active'?'inline-flex':'none';
  if(TAB==='active') renderActive(); else renderArchive();
}

function rowHtml(o){
  const cls=needsAction(o)?'act-row':'';
  const ps=payState(o);
  const stages=STAGES.map(([f,l,src])=>{
    if(src==='sf'){
      const st=ps[f]||{on:false,src:''};
      const clickable=(f==='ops_deposit1_paid'||f==='ops_deposit2_paid');
      const title=st.src==='cash'?'Uhradené v hotovosti':(clickable?'Úhradu v hotovosti zadáš v detaile (klikni)':'Automaticky zo SuperFaktúry');
      return `<td class="st"><span class="chip ${st.src} ${st.on?'on':''} ${clickable?'clk':''}" ${clickable?`data-exp="${o.id}"`:''} title="${title}">${st.on?'✓':''}</span></td>`;
    }
    if(src==='tri'){
      const v=+o[f]||0; const cls=v===2?'full':v===1?'half':'';
      const title=v===2?'Celé zaplatené (klikni → nezaplatené)':v===1?'Záloha zaplatená 50 % (klikni → celé)':'Nezaplatené (klikni → záloha 50 %)';
      return `<td class="st"><button class="chip tri ${cls}" data-tri="${f}" data-id="${o.id}" title="${title}">${v===2?'✓':''}</button></td>`;
    }
    const on=!!o[f]; return `<td class="st"><button class="chip ${on?'on':''}" data-tog="${f}" data-id="${o.id}">${on?'✓':''}</button></td>`;
  }).join('');
  return `<tr class="${cls}" data-row="${o.id}">
    <td><span class="code" data-exp="${o.id}">${esc(o.code||'')}</span></td>
    <td class="client">${esc(clientName(o))}</td>
    <td class="prod" title="${esc(o.items_summary)}">${esc(o.items_summary||'—')}</td>
    ${stages}
    <td class="dt"><span class="plan" data-exp="${o.id}" title="klikni a uprav v detaile">${planLabel(o)}</span></td>
    <td style="text-align:right"><button class="exp" data-exp="${o.id}" title="detail">⋯</button></td>
  </tr>`;
}
function headHtml(){
  return `<thead><tr>
    <th>OBJ</th><th>Klient</th><th>Produkty</th>
    ${STAGES.map(([_,l])=>`<th class="st">${l}</th>`).join('')}
    <th class="dt">Plán. dodanie</th><th></th>
  </tr></thead>`;
}
function invoiceBlock(o){
  const docs=(DOCS[o.id]||[]).slice().sort((a,b)=>(a.issued_at||'')<(b.issued_at||'')?-1:1);
  const ot=+o.total||0;
  const prof=proformas(o);
  const idxOf=(d)=> prof.findIndex(p=>String(p.sf_document_id)===String(d.sf_document_id));
  const cashAmt=(i)=> i===0?(+o.ops_deposit1_cash_amount||0):i===1?(+o.ops_deposit2_cash_amount||0):0;
  const cashDate=(i)=> i===0?o.ops_deposit1_cash_date:i===1?o.ops_deposit2_cash_date:null;
  const genCash=+o.ops_cash_amount||0;
  const profPaidSum=prof.reduce((a,p,i)=> a + (fvzFor(o,p)?(+p.total||0):cashAmt(i)), 0) + genCash;
  const sharePaid=ot?Math.round(profPaidSum/ot*100):0;
  const shareLabel = sharePaid>=100?'100 % zaplatené':(sharePaid>0?sharePaid+' % zaplatené':'nezaplatené');
  const pillCls = sharePaid>=100?'p-full':sharePaid>0?'p-half':'p-none';
  const summary = ot? `<div class="invsum">Hodnota objednávky <b>${money(ot)}</b> · zaplatené <b>${money(profPaidSum)}</b> <span class="pill ${pillCls}">${shareLabel}</span></div>` : '';
  if(!docs.length) return `<div class="invwrap"><div class="invhd">Faktúry zo SuperFaktúry</div>${summary}<p class="muted">Zatiaľ žiadne vystavené faktúry.</p></div>`;
  const typ=(d)=> isZaloha(d)?'Zálohová' : isTaxDoc(d)?'Daň. doklad k platbe' : isFinal(d)?'Koncová' : (d.doc_type||'');
  const pct=(d)=>ot?Math.round((+d.total)/ot*100)+' %':'—';
  const paidCell=(d)=>{
    if(isZaloha(d)){
      const f=fvzFor(o,d); if(f) return `<span class="ok">${fmtD(f.paid_at)||fmtD(f.issued_at)||'zaplatená'}</span>`;
      const i=idxOf(d); const ca=cashAmt(i);
      if(ca>0) return `<span class="ok">hotovosť ${fmtD(cashDate(i))||''} · ${money(ca)}</span>`;
      return '<span class="bad">neuhradená</span>';
    }
    return docPaid(d)? `<span class="ok">${fmtD(d.paid_at)||'zaplatená'}</span>` : '<span class="wait">čaká</span>';
  };
  const rows=docs.map(d=>`<tr>
    <td class="mono">${esc(d.code)}</td><td>${typ(d)}</td>
    <td class="r mono">${money(d.amount)}</td><td class="r mono">${money(d.vat)}</td><td class="r mono">${money(d.total)}</td>
    <td class="r">${pct(d)}</td><td class="mono">${fmtD(d.issued_at)||'—'}</td><td class="mono">${fmtD(d.due_at)||'—'}</td>
    <td>${paidCell(d)}</td>
  </tr>`).join('');
  return `<div class="invwrap"><div class="invhd">Faktúry zo SuperFaktúry</div>${summary}
    <table class="inv"><thead><tr><th>Doklad</th><th>Typ</th><th class="r">Bez DPH</th><th class="r">DPH</th><th class="r">S DPH</th><th class="r">Podiel</th><th>Vystavená</th><th>Splatnosť</th><th>Uhradená</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function cashBlock(o){
  const prof=proformas(o);
  let rows='';
  prof.forEach((p,i)=>{
    if(i>1 || fvzFor(o,p)) return;
    const amtF=i===0?'ops_deposit1_cash_amount':'ops_deposit2_cash_amount';
    const dateF=i===0?'ops_deposit1_cash_date':'ops_deposit2_cash_date';
    rows+=`<div class="cashrow"><span>Záloha ${i+1} (${money(p.total)}) — v hotovosti:</span>
      <input type="number" step="0.01" data-f="${amtF}" data-id="${o.id}" value="${o[amtF]??''}" placeholder="suma €">
      <input type="date" data-f="${dateF}" data-id="${o.id}" value="${o[dateF]||''}"></div>`;
  });
  // všeobecná hotovosť — vždy k dispozícii, aj keď nie je žiadna faktúra
  rows+=`<div class="cashrow"><span>Úhrada v hotovosti (bez faktúry):</span>
      <input type="number" step="0.01" data-f="ops_cash_amount" data-id="${o.id}" value="${o.ops_cash_amount??''}" placeholder="suma €">
      <input type="date" data-f="ops_cash_date" data-id="${o.id}" value="${o.ops_cash_date||''}"></div>`;
  return `<div class="cashwrap"><div class="invhd">Úhrady v hotovosti (mimo SuperFaktúry)</div>${rows}</div>`;
}
function detailHtml(o){
  return `<tr class="detail" id="detail-${o.id}"><td colspan="${STAGES.length+5}">
    ${invoiceBlock(o)}
    ${cashBlock(o)}
    <div class="grid" style="margin-top:14px">
      <div class="f"><label>Objednávka u dodávateľa</label><input data-f="ops_supplier_ref" data-id="${o.id}" value="${esc(o.ops_supplier_ref)}" placeholder="názov/číslo"></div>
      <div class="f"><label>ETA výroby (predbežné ukončenie)</label><input type="date" data-f="ops_eta" data-id="${o.id}" value="${o.ops_eta||''}"></div>
      <div class="f"><label>Plánované dodanie — od / do</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="date" data-f="ops_delivery_at" data-id="${o.id}" value="${o.ops_delivery_at||''}" title="od / konkrétny deň">
          <span style="color:var(--mut)">–</span>
          <input type="date" data-f="ops_delivery_to" data-id="${o.id}" value="${o.ops_delivery_to||''}" title="do (pre rozsah)">
        </div>
        <span class="muted" style="margin-top:2px">Vyplň len „od" pre konkrétny deň, alebo oba pre okno (napr. 6–8 týždňov).</span>
      </div>
      <div class="f"><label>Výkladka / montáž</label><input data-f="ops_assembly" data-id="${o.id}" value="${esc(o.ops_assembly)}" placeholder="v+m+lo, dohodnuté…"></div>
      <div class="f"><label>Provízia architekta</label><input data-f="ops_commission" data-id="${o.id}" value="${esc(o.ops_commission)}" placeholder="poznámka"></div>
      <div class="f full"><label>Doručovacia adresa / info</label><textarea data-f="ops_delivery_info" data-id="${o.id}" rows="2" placeholder="adresa, kontakt, pokyny…">${esc(o.ops_delivery_info)}</textarea></div>
      <div class="f full"><label>Poznámka</label><textarea data-f="ops_note" data-id="${o.id}" rows="2">${esc(o.ops_note)}</textarea></div>
    </div>
    <div class="detail-actions">
      <span class="saved" id="saved-${o.id}">uložené ✓</span>
      ${o.ops_done
        ? `<button class="btn-reopen" data-reopen="${o.id}">Vrátiť medzi aktívne</button>`
        : `<button class="btn-done" data-finish="${o.id}">Označiť ako ukončené → archív</button>`}
    </div>
  </td></tr>`;
}

function renderActive(){
  let list=ORDERS.filter(o=>!o.ops_done);
  if(Q) list=filterQ(list);
  if(ONLY) list=list.filter(needsAction);
  list.sort((a,b)=>{const da=a.ops_delivery_at||a.ops_eta||'9999',db=b.ops_delivery_at||b.ops_eta||'9999';return da<db?-1:da>db?1:0;});
  const need=ORDERS.filter(o=>!o.ops_done&&needsAction(o)).length;
  $('count').textContent=`${list.length} aktívnych · ${need} čaká na akciu`;
  $('view').innerHTML = list.length? `<div class="tablecard"><table>${headHtml()}<tbody>${list.map(rowHtml).join('')}</tbody></table></div>` : '<div class="empty">Žiadne aktívne objednávky.</div>';
  $('foot').textContent='';
  wireTable();
}
function renderArchive(){
  let list=ORDERS.filter(o=>o.ops_done);
  if(Q) list=filterQ(list);
  $('count').textContent=`${list.length} ukončených`;
  const groups={};
  list.forEach(o=>{const ym=(o.ops_done_at||o.ops_delivery_at||o.issued_at||'').slice(0,7);(groups[ym]=groups[ym]||[]).push(o);});
  const yms=Object.keys(groups).sort().reverse();
  $('view').innerHTML = yms.length? yms.map(ym=>`
    <details class="month">
      <summary><span><span class="chev">▸</span>${ymLabel(ym)}</span><span class="c">${groups[ym].length} objednávok</span></summary>
      <div class="tablecard" style="border:none;border-radius:0"><table>${headHtml()}<tbody>${groups[ym].map(rowHtml).join('')}</tbody></table></div>
    </details>`).join('') : '<div class="empty">Archív je zatiaľ prázdny.</div>';
  $('foot').textContent='';
  wireTable();
}
function filterQ(list){const q=Q.toLowerCase();return list.filter(o=>(o.code||'').toLowerCase().includes(q)||clientName(o).toLowerCase().includes(q)||(o.items_summary||'').toLowerCase().includes(q));}

function wireTable(){
  document.querySelectorAll('.chip[data-tog]').forEach(b=> b.onclick=()=>toggle(b.dataset.id,b.dataset.tog,b));
  document.querySelectorAll('.chip[data-tri]').forEach(b=> b.onclick=()=>cycleTri(b.dataset.id,b.dataset.tri,b));
  document.querySelectorAll('input.dt[data-f]').forEach(inp=> inp.onchange=()=>save(inp.dataset.id,inp.dataset.f,inp.value||null));
  document.querySelectorAll('[data-exp]').forEach(el=> el.onclick=()=>expand(el.dataset.exp));
  // restore open details
  OPEN.forEach(id=> insertDetail(id));
}
function order(id){return ORDERS.find(x=>String(x.id)===String(id));}
async function toggle(id,field,btn){
  const o=order(id);const nv=!o[field];o[field]=nv;
  if(btn){btn.classList.toggle('on',nv);btn.textContent=nv?'✓':'';}
  // row highlight may change
  const tr=document.querySelector(`tr[data-row="${id}"]`); if(tr) tr.classList.toggle('act-row',needsAction(o));
  updateCount();
  await sb.from('order').update({[field]:nv}).eq('id',id); flash(id);
}
async function cycleTri(id,field,btn){
  const o=order(id); const nv=((+o[field]||0)+1)%3; o[field]=nv;
  if(btn){ btn.classList.remove('half','full'); if(nv===1)btn.classList.add('half'); if(nv===2)btn.classList.add('full'); btn.textContent=nv===2?'✓':'';
    btn.title=nv===2?'Celé zaplatené (klikni → nezaplatené)':nv===1?'Záloha zaplatená 50 % (klikni → celé)':'Nezaplatené (klikni → záloha 50 %)'; }
  await sb.from('order').update({[field]:nv}).eq('id',id); flash(id);
}
async function save(id,field,val){const o=order(id);o[field]=val;const tr=document.querySelector(`tr[data-row="${id}"]`);if(tr)tr.classList.toggle('act-row',needsAction(o));
  // sync the inline date cell if edited from detail
  const cell=document.querySelector(`input.dt[data-id="${id}"][data-f="${field}"]`); if(cell&&cell.value!==(val||'')) cell.value=val||'';
  if(field==='ops_delivery_at'||field==='ops_delivery_to'){ const pl=document.querySelector(`.plan[data-exp="${id}"]`); if(pl) pl.textContent=planLabel(order(id)); }
  updateCount(); await sb.from('order').update({[field]:val}).eq('id',id); flash(id);}
function flash(id){const s=$('saved-'+id);if(s){s.classList.add('show');setTimeout(()=>s.classList.remove('show'),1100);}}
function updateCount(){ if(TAB==='active'){const need=ORDERS.filter(o=>!o.ops_done&&needsAction(o)).length;const act=ORDERS.filter(o=>!o.ops_done).length;$('count').textContent=`${act} aktívnych · ${need} čaká na akciu`;} }

function expand(id){ OPEN.has(id)?removeDetail(id):insertDetail(id); }
function insertDetail(id){
  if(document.getElementById('detail-'+id)) return;
  const tr=document.querySelector(`tr[data-row="${id}"]`); if(!tr) return;
  tr.insertAdjacentHTML('afterend',detailHtml(order(id))); OPEN.add(id); wireDetail(id);
}
function removeDetail(id){const d=document.getElementById('detail-'+id);if(d)d.remove();OPEN.delete(id);}
function wireDetail(id){
  const d=document.getElementById('detail-'+id); if(!d) return;
  d.querySelectorAll('[data-f]').forEach(inp=> inp.onchange=()=>{
    const f=inp.dataset.f; let v=inp.value;
    if(f.includes('cash_amount')) v = (v===''?null:Number(v));
    else v = (v||null);
    if(f.includes('_cash_')){ const o=order(id); o[f]=v; flash(id); sb.from('order').update({[f]:v}).eq('id',id); render(); }
    else save(id,f,v);
  });
  d.querySelectorAll('[data-tog]').forEach(c=> c.onchange=()=>{const o=order(id);o[c.dataset.tog]=c.checked;save(id,c.dataset.tog,c.checked);});
  const fin=d.querySelector('[data-finish]'); if(fin) fin.onclick=async()=>{const o=order(id);o.ops_done=true;o.ops_done_at=new Date().toISOString().slice(0,10);OPEN.delete(id);await sb.from('order').update({ops_done:true,ops_done_at:o.ops_done_at}).eq('id',id);render();};
  const re=d.querySelector('[data-reopen]'); if(re) re.onclick=async()=>{const o=order(id);o.ops_done=false;OPEN.delete(id);await sb.from('order').update({ops_done:false}).eq('id',id);render();};
}

$('tabs').onclick=(e)=>{const b=e.target.closest('.tab');if(!b)return;TAB=b.dataset.tab;OPEN.clear();document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));render();};
$('search').oninput=(e)=>{Q=e.target.value.trim();OPEN.clear();render();};
$('onlyAction').onchange=(e)=>{ONLY=e.target.checked;render();};

init();
</script>
</body>
</html>
